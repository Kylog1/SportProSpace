<!-- Canva template — STORY 1080x1920 (uniwersalny) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#FFFFFF"/>
  <!-- header navy band -->
  <rect x="0" y="0" width="1080" height="500" fill="#0B1736"/>
  <!-- safe-zone guides (250 top / 320 bottom) -->
  <g stroke="#FFFFFF" stroke-dasharray="6,8" opacity="0.15" fill="none">
    <line x1="0" y1="250" x2="1080" y2="250"/>
    <line x1="0" y1="1600" x2="1080" y2="1600"/>
  </g>
  <!-- logo -->
  <g transform="translate(72,290)">
    <g transform="scale(0.55)">
      <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
    </g>
    <text x="84" y="50" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" letter-spacing="-0.8" fill="#FFFFFF">Sport Pro <tspan fill="#8aa6cd">Space</tspan></text>
  </g>
  <!-- main message white card overlapping -->
  <g transform="translate(72,420)">
    <rect width="936" height="1080" rx="24" fill="#FFFFFF" stroke="#dbe5f1"/>
    <text x="48" y="100" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" letter-spacing="3" fill="#1E3A8A">INSIGHT TYGODNIA</text>
    <text x="48" y="280" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="76" letter-spacing="-2.5" fill="#0B1736">
      <tspan x="48" dy="0">Tytuł posta —</tspan>
      <tspan x="48" dy="92">edytuj w Canvie.</tspan>
    </text>
    <text x="48" y="600" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="32" letter-spacing="-0.5" fill="#293f66">
      <tspan x="48" dy="0">Krótki paragraf objaśniający</tspan>
      <tspan x="48" dy="44">kontekst i dane stojące za tym</tspan>
      <tspan x="48" dy="44">spostrzeżeniem.</tspan>
    </text>
    <!-- inline CTA -->
    <g transform="translate(48,920)">
      <rect width="380" height="72" rx="36" fill="#0B1736"/>
      <text x="190" y="46" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" text-anchor="middle" fill="#FFFFFF">Przeczytaj cały raport →</text>
    </g>
  </g>
  <!-- footer -->
  <text x="540" y="1560" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" letter-spacing="4" text-anchor="middle" fill="#5e80b3">SPORTPROSPACE.PL</text>
</svg>
