<!-- Canva template — STAT / LICZBA 1080x1080. Edytowalne pole liczby + opis. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1736"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgT)"/>
  <!-- subtle grid -->
  <g stroke="#FFFFFF" opacity="0.06">
    <line x1="0" y1="270" x2="1080" y2="270"/>
    <line x1="0" y1="540" x2="1080" y2="540"/>
    <line x1="0" y1="810" x2="1080" y2="810"/>
    <line x1="270" y1="0" x2="270" y2="1080"/>
    <line x1="540" y1="0" x2="540" y2="1080"/>
    <line x1="810" y1="0" x2="810" y2="1080"/>
  </g>
  <!-- label -->
  <text x="540" y="240" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" letter-spacing="5" text-anchor="middle" fill="#8aa6cd">RETENCJA ZAWODNIKÓW</text>
  <!-- big number -->
  <text x="540" y="600" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="320" letter-spacing="-12" text-anchor="middle" fill="#FFFFFF">87%</text>
  <!-- delta -->
  <g transform="translate(420,660)">
    <rect width="240" height="48" rx="24" fill="#1E3A8A"/>
    <text x="120" y="32" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" text-anchor="middle" fill="#FFFFFF">▲ +4.2 pp vs Q1</text>
  </g>
  <!-- caption -->
  <text x="540" y="820" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="26" letter-spacing="-0.5" text-anchor="middle" fill="#dbe5f1">Średnia w 17 akademiach sezon 2025/2026</text>
  <!-- footer logo -->
  <g transform="translate(440,960)">
    <g transform="scale(0.35)">
      <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
    </g>
    <text x="56" y="36" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" letter-spacing="-0.5" fill="#FFFFFF">Sport Pro <tspan fill="#8aa6cd">Space</tspan></text>
  </g>
</svg>
