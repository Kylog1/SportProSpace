<!-- Canva template — QUOTE / CYTAT 1080x1080. Wszystkie pola tekstowe edytowalne po imporcie SVG do Canvy. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#F0F4FA"/>
  <!-- decorative quote mark -->
  <text x="80" y="320" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="320" fill="#dbe5f1">"</text>
  <!-- quote body -->
  <text x="120" y="500" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="56" letter-spacing="-2" fill="#0B1736">
    <tspan x="120" dy="0">Kluczem do retencji</tspan>
    <tspan x="120" dy="74">zawodników nie jest</tspan>
    <tspan x="120" dy="74">wynik sportowy —</tspan>
    <tspan x="120" dy="74" fill="#1E3A8A">a poczucie progresu.</tspan>
  </text>
  <!-- author block -->
  <g transform="translate(120,880)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#1E3A8A" stroke-width="3"/>
    <text x="0" y="40" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" fill="#0B1736">Imię Nazwisko</text>
    <text x="0" y="72" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="18" fill="#5e80b3">Stanowisko, Akademia / Klub</text>
  </g>
  <!-- top-right logo lockup -->
  <g transform="translate(840,68)">
    <g transform="scale(0.4)">
      <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="#0B1736"/>
      <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
    </g>
    <text x="60" y="40" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="-0.5" fill="#0B1736">Sport Pro <tspan fill="#1E3A8A">Space</tspan></text>
  </g>
</svg>
