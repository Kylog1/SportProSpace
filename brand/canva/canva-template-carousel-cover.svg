<!-- Canva template — KARUZELA cover 1080x1080. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#FFFFFF"/>
  <!-- left navy block -->
  <rect x="0" y="0" width="540" height="1080" fill="#0B1736"/>
  <!-- subtle dots in navy block -->
  <g fill="#1E3A8A" opacity="0.45">
    <circle cx="60" cy="60" r="3"/><circle cx="120" cy="60" r="3"/><circle cx="180" cy="60" r="3"/>
    <circle cx="60" cy="120" r="3"/><circle cx="120" cy="120" r="3"/><circle cx="180" cy="120" r="3"/>
  </g>
  <!-- big "01" -->
  <text x="60" y="280" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="180" letter-spacing="-8" fill="#1E3A8A">01</text>
  <text x="60" y="330" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" letter-spacing="4" fill="#8aa6cd">SERIA · 5 KART</text>
  <!-- title -->
  <text x="60" y="540" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="58" letter-spacing="-2" fill="#FFFFFF">
    <tspan x="60" dy="0">Jak zatrzymać</tspan>
    <tspan x="60" dy="74">zawodnika w</tspan>
    <tspan x="60" dy="74">akademii?</tspan>
  </text>
  <!-- swipe hint -->
  <g transform="translate(60,960)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="18" letter-spacing="2" fill="#dbe5f1">PRZESUŃ →</text>
  </g>
  <!-- right side: visual placeholder -->
  <g transform="translate(580,140)">
    <rect width="440" height="800" rx="20" fill="#F0F4FA"/>
    <text x="220" y="380" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="18" letter-spacing="2" text-anchor="middle" fill="#5e80b3">PHOTO / CHART</text>
    <text x="220" y="420" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="14" text-anchor="middle" fill="#8aa6cd">(podmień w Canvie)</text>
  </g>
  <!-- top right logo -->
  <g transform="translate(580,72)">
    <g transform="scale(0.4)">
      <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="#0B1736"/>
      <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
    </g>
    <text x="60" y="40" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="-0.5" fill="#0B1736">Sport Pro <tspan fill="#1E3A8A">Space</tspan></text>
  </g>
</svg>
