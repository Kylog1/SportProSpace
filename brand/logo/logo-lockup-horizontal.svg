<!-- Lockup poziomy: symbol lewo + wordmark prawo · jasne tło -->
<!-- Canvas: 1800x480, symbol 480x480, wordmark obok -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 480" width="1800" height="480">
  <rect width="1800" height="480" fill="#FFFFFF"/>
  <!-- symbol skalowany 480x480 (w/h proporcja 1:1) -->
  <g transform="scale(0.4444)">
    <!-- S w 1080x1080 zmniejszone 0.4444× = 480x480 -->
    <rect x="360" y="310" width="360" height="80"  rx="8" fill="#0B1736"/>
    <rect x="360" y="310" width="80"  height="200" rx="8" fill="#0B1736"/>
    <rect x="360" y="500" width="360" height="80"  rx="8" fill="#0B1736"/>
    <rect x="640" y="500" width="80"  height="200" rx="8" fill="#0B1736"/>
    <rect x="360" y="690" width="360" height="80"  rx="8" fill="#0B1736"/>
    <circle cx="720" cy="310" r="40" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="12"/>
  </g>
  <!-- wordmark: Sport Pro Space -->
  <text x="520" y="220" font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="148" letter-spacing="-5" fill="#0B1736">Sport Pro</text>
  <text x="520" y="390" font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="148" letter-spacing="-5" fill="#1E3A8A">Space</text>
</svg>
