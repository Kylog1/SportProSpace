  <rect width="1800" height="480" fill="#0B1736"/>
  <!-- symbol (biały S na ciemnym) -->
  <g transform="scale(0.4444)">
    <rect x="360" y="310" width="360" height="80"  rx="8" fill="#FFFFFF"/>
    <rect x="360" y="310" width="80"  height="200" rx="8" fill="#FFFFFF"/>
    <rect x="360" y="500" width="360" height="80"  rx="8" fill="#FFFFFF"/>
    <rect x="640" y="500" width="80"  height="200" rx="8" fill="#FFFFFF"/>
    <rect x="360" y="690" width="360" height="80"  rx="8" fill="#FFFFFF"/>
    <circle cx="720" cy="310" r="40" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="12"/>
  </g>
  <text x="520" y="220" font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="148" letter-spacing="-5" fill="#FFFFFF">Sport Pro</text>
  <text x="520" y="390" font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="148" letter-spacing="-5" fill="#8aa6cd">Space</text>
