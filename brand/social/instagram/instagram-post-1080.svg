<!-- Instagram post (1:1) — 1080x1080. Szablon: cover edukacyjny. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#FFFFFF"/>
  <!-- subtle grid -->
  <g stroke="#dbe5f1" stroke-width="1" opacity="0.6">
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="600" x2="1080" y2="600"/>
    <line x1="0" y1="800" x2="1080" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1080"/>
    <line x1="400" y1="0" x2="400" y2="1080"/>
    <line x1="600" y1="0" x2="600" y2="1080"/>
    <line x1="800" y1="0" x2="800" y2="1080"/>
  </g>
  <!-- header bar with logo -->
  <g transform="translate(72,72)">
    <g transform="scale(0.55)">
      <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="#0B1736"/>
      <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
    </g>
    <text x="84" y="50" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" letter-spacing="-0.8" fill="#0B1736">Sport Pro <tspan fill="#1E3A8A">Space</tspan></text>
  </g>
  <!-- badge -->
  <g transform="translate(72,200)">
    <rect width="240" height="44" rx="22" fill="#F0F4FA"/>
    <text x="120" y="29" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="14" letter-spacing="2" text-anchor="middle" fill="#293f66">INSIGHT • 03/2026</text>
  </g>
  <!-- main heading (EDYTOWALNE) -->
  <text x="72" y="370" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="84" letter-spacing="-3" fill="#0B1736">
    <tspan x="72" dy="0">68% zawodników</tspan>
    <tspan x="72" dy="100">odchodzi przez brak</tspan>
    <tspan x="72" dy="100" fill="#1E3A8A">feedbacku.</tspan>
  </text>
  <!-- supporting stat -->
  <g transform="translate(72,780)">
    <rect width="936" height="180" rx="16" fill="#0B1736"/>
    <text x="40" y="60" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="18" letter-spacing="2" fill="#8aa6cd">DANE Z BADAŃ NPS</text>
    <text x="40" y="130" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="48" letter-spacing="-1.5" fill="#FFFFFF">412 zawodników · 17 akademii · 2025/2026</text>
  </g>
  <!-- footer mark -->
  <text x="540" y="1030" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" letter-spacing="2" text-anchor="middle" fill="#5e80b3">SPORTPROSPACE.PL</text>
</svg>
