<!-- Instagram profile picture: rendered as 320x320 (display), upload 320x320+ (Insta wymaga min 320x320, max 1080x1080). Wyświetla się jako koło. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1736"/>
    </linearGradient>
  </defs>
  <!-- safe area: avatar wyświetlany jako koło -> bezpieczna strefa to wpisane koło -->
  <rect width="320" height="320" fill="url(#ig)"/>
  <!-- mark wycentrowany, scaled -->
  <g transform="translate(96,72) scale(1.0)">
    <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
  </g>
  <text x="160" y="252" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="-0.5" text-anchor="middle" fill="#FFFFFF">Sport Pro Space</text>
</svg>
