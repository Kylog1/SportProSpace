<!-- Instagram Story / Reel cover — 1080x1920 px (9:16)
     Safe zone: unikaj treści w górnych 250px i dolnych 320px (UI platformy) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#0B1736"/>
  <!-- subtle radial glow center -->
  <circle cx="540" cy="960" r="700" fill="#1E3A8A" opacity="0.18"/>
  <!-- safe-zone indicators (usuń przed wgraniem wersji produkcyjnej) -->
  <line x1="0" y1="250" x2="1080" y2="250" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="6,10" opacity="0.12"/>
  <line x1="0" y1="1600" x2="1080" y2="1600" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="6,10" opacity="0.12"/>
  <!-- logo — w safe zone, centrum góry -->
  <g transform="translate(358,310) scale(0.34)">
    <rect x="360" y="310" width="360" height="80"  rx="8" fill="#FFFFFF"/>
    <rect x="360" y="310" width="80"  height="200" rx="8" fill="#FFFFFF"/>
    <rect x="360" y="500" width="360" height="80"  rx="8" fill="#FFFFFF"/>
    <rect x="640" y="500" width="80"  height="200" rx="8" fill="#FFFFFF"/>
    <rect x="360" y="690" width="360" height="80"  rx="8" fill="#FFFFFF"/>
    <circle cx="720" cy="310" r="40" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="12"/>
  </g>
  <!-- headline -->
  <text font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="108" letter-spacing="-4" text-anchor="middle">
    <tspan x="540" y="800" fill="#FFFFFF">Mierzymy</tspan>
    <tspan x="540" dy="130" fill="#FFFFFF">doświadczenie</tspan>
    <tspan x="540" dy="130" fill="#8aa6cd">w sporcie.</tspan>
  </text>
  <!-- sub -->
  <text x="540" y="1200" font-family="Inter,system-ui,sans-serif" font-weight="400" font-size="36" letter-spacing="-0.5" text-anchor="middle" fill="#dbe5f1">
    <tspan x="540" dy="0">Niezależne badania NPS</tspan>
    <tspan x="540" dy="52">dla akademii i klubów sportowych.</tspan>
  </text>
  <!-- CTA card -->
  <g transform="translate(120,1350)">
    <rect width="840" height="160" rx="20" fill="#FFFFFF"/>
    <text x="420" y="66" font-family="Inter,system-ui,sans-serif" font-weight="500" font-size="22" letter-spacing="3" text-anchor="middle" fill="#5e80b3">PRZESUŃ W GÓRĘ</text>
    <text x="420" y="122" font-family="Inter,system-ui,sans-serif" font-weight="700" font-size="48" letter-spacing="-1.5" text-anchor="middle" fill="#0B1736">Zamów badanie NPS</text>
  </g>
  <!-- footer w safe zone -->
  <text x="540" y="1560" font-family="Inter,system-ui,sans-serif" font-weight="500" font-size="24" letter-spacing="4" text-anchor="middle" fill="#5e80b3">SPORTPROSPACE.PL</text>
</svg>
