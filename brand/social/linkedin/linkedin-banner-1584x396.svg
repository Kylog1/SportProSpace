<!-- LinkedIn Company / Personal banner — 1584x396 px. Safe zone wycenrtuj kluczowe elementy (mobile crop ~ 1128x192). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="liB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1736"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1584" height="396" fill="url(#liB)"/>
  <rect width="1584" height="396" fill="url(#dots)"/>
  <!-- safe zone for desktop avatar overlap (left ~272x272 reserved for profile pic on personal page) -->
  <!-- copy block centered around safe zone -->
  <g transform="translate(420,110)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="18" letter-spacing="4" fill="#8aa6cd">EXPERIENCE INTELLIGENCE FOR SPORT</text>
    <text x="0" y="80" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="56" letter-spacing="-2" fill="#FFFFFF">Mierzymy. Analizujemy. Rekomendujemy.</text>
    <text x="0" y="148" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" letter-spacing="-0.3" fill="#dbe5f1">Niezależne badania doświadczenia zawodników, rodziców i kibiców.</text>
    <!-- CTA pill -->
    <g transform="translate(0,180)">
      <rect width="280" height="56" rx="28" fill="#FFFFFF"/>
      <text x="140" y="36" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="18" text-anchor="middle" fill="#0B1736">sportprospace.pl →</text>
    </g>
  </g>
  <!-- top-right symbol -->
  <g transform="translate(1380,72) scale(1.4)">
    <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9"/>
    <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
  </g>
</svg>
