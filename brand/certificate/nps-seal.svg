<!-- Okrągła pieczęć — 120×120 px — wariant kompaktowy do sidebar/bannera/dokumentów -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Sport Space Pro NPS Quality Certificate 2026">
  <defs>
    <linearGradient id="seal-bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1736"/>
    </linearGradient>
  </defs>

  <!-- Tło koła -->
  <circle cx="60" cy="60" r="59" fill="url(#seal-bg)"/>

  <!-- Zewnętrzny ring (dekoracyjny) -->
  <circle cx="60" cy="60" r="55" fill="none"
          stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Wewnętrzny ring z przerywaniem -->
  <circle cx="60" cy="60" r="50" fill="none"
          stroke="rgba(255,255,255,0.14)" stroke-width="0.75"
          stroke-dasharray="3 4.5"/>

  <!-- ShieldCheck icon (Lucide, wyśrodkowany przy 60,44) — scale=1.5 -->
  <!-- center of icon ≈ (12,12) in 24×24 → tx=60-18=42, ty=44-18=26 -->
  <g transform="translate(42, 26) scale(1.5)" fill="none"
     stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-width="1.6"/>
    <path d="M9 12l2 2 4-4"                                 stroke-width="1.6"/>
  </g>

  <!-- "NPS" duże -->
  <text x="60" y="72"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="800" letter-spacing="-0.3"
        text-anchor="middle" fill="white">NPS</text>

  <!-- "CERTYFIKAT JAKOŚCI" małe -->
  <text x="60" y="85"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="6.5" font-weight="600" letter-spacing="1.6"
        text-anchor="middle" fill="#8aa6cd">CERTYFIKAT JAKOŚCI</text>

  <!-- Separator -->
  <line x1="30" y1="93" x2="90" y2="93" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- "SPORT SPACE PRO" drobne -->
  <text x="60" y="106"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="6" font-weight="500" letter-spacing="1.8"
        text-anchor="middle" fill="#5e80b3">SPORT SPACE PRO</text>

  <!-- Rok -->
  <text x="60" y="116"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="5.5" font-weight="500" letter-spacing="1.2"
        text-anchor="middle" fill="#3f6398">2026</text>
</svg>
