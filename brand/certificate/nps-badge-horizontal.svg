<!-- Poziomy badge — 252×72 px — kompaktowy wariant do footera / sekcji "O klubie" -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 72" width="252" height="72"
     role="img" aria-label="Sport Space Pro — NPS Quality Certificate 2026">
  <defs>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#2952B3"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Karta -->
  <rect width="252" height="72" rx="10" fill="white"/>
  <rect x="0.75" y="0.75" width="250.5" height="70.5" rx="9.25"
        fill="none" stroke="#dbe5f1" stroke-width="1.5"/>

  <!-- Ikonka (navy rounded square) -->
  <rect x="12" y="14" width="44" height="44" rx="8" fill="url(#icon-grad)"/>

  <!-- ShieldCheck icon (Lucide, skalowany do ~22px, wyśrodkowany w 44×44 bloku: środek 34,36) -->
  <!-- Lucide ShieldCheck 24×24, scale=0.92, translate=(34-12*0.92, 36-12.5*0.92)=(22.96,24.5)≈(23,24.5) -->
  <g transform="translate(23, 24.5) scale(0.92)" fill="none" stroke="white"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke-width="2.1"/>
    <path d="M9 12l2 2 4-4"                                 stroke-width="2.1"/>
  </g>

  <!-- Pionowy separator -->
  <line x1="68" y1="18" x2="68" y2="54" stroke="#e8edf5" stroke-width="1"/>

  <!-- Tytuł główny -->
  <text x="80" y="31"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="13.5" font-weight="700" fill="#172554">Certyfikat Jakości</text>

  <!-- Nazwa marki -->
  <text x="80" y="47"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="8.5" font-weight="600" fill="#5e80b3" letter-spacing="1.4">SPORT SPACE PRO</text>

  <!-- Rok — pill top-right -->
  <rect x="202" y="15" width="38" height="18" rx="4" fill="#f0f4fa"/>
  <text x="221" y="27.5" text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="9" font-weight="600" fill="#293f66" letter-spacing="0.3">2026</text>
</svg>
