<!-- Pionowy badge certyfikatu — 320×400 px — do osadzania na stronach klientów jako <img> -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400"
     role="img" aria-label="Sport Space Pro — NPS Quality Certificate Edition 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FA"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#2952B3"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Karta -->
  <rect width="320" height="400" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="318.5" height="398.5" rx="15.25"
        fill="none" stroke="#dbe5f1" stroke-width="1.5"/>

  <!-- Górna etykieta -->
  <text x="160" y="36"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="600" font-size="9" letter-spacing="2.8"
        text-anchor="middle" fill="#5e80b3">EDITION 2026  ·  CERTYFIKAT</text>

  <!-- Tarcza (klasyczna forma, navy gradient) -->
  <g transform="translate(96, 54)">
    <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z"
          fill="url(#shield-grad)"/>
    <!-- Subtelny blask na tarczy -->
    <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z"
          fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <!-- Checkmark wewnątrz -->
    <path d="M36 70 L58 92 L96 46"
          fill="none" stroke="#FFFFFF" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Nazwa marki -->
  <text x="160" y="214"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="600" font-size="10" letter-spacing="2.6"
        text-anchor="middle" fill="#5e80b3">SPORT SPACE PRO</text>

  <!-- Tytuł certyfikatu -->
  <text x="160" y="248"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="700" font-size="22" letter-spacing="-0.6"
        text-anchor="middle" fill="#0B1736">Certyfikat</text>
  <text x="160" y="276"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="700" font-size="22" letter-spacing="-0.6"
        text-anchor="middle" fill="#0B1736">Jakości</text>

  <!-- Separator -->
  <line x1="72" y1="298" x2="248" y2="298" stroke="#dbe5f1" stroke-width="1"/>

  <!-- Metryki -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     text-anchor="middle">
    <g transform="translate(80, 0)">
      <text y="322" font-weight="500" font-size="8.5" letter-spacing="1.8" fill="#5e80b3">NPS</text>
      <text y="347" font-weight="700" font-size="22" letter-spacing="-0.5" fill="#0B1736">+62</text>
    </g>
    <g transform="translate(160, 0)">
      <text y="322" font-weight="500" font-size="8.5" letter-spacing="1.8" fill="#5e80b3">RETENCJA</text>
      <text y="347" font-weight="700" font-size="22" letter-spacing="-0.5" fill="#0B1736">87%</text>
    </g>
    <g transform="translate(240, 0)">
      <text y="322" font-weight="500" font-size="8.5" letter-spacing="1.8" fill="#5e80b3">ZAUFANIE</text>
      <text y="347" font-weight="700" font-size="22" letter-spacing="-0.5" fill="#0B1736">4.5</text>
    </g>
  </g>

  <!-- Separator dolny -->
  <line x1="72" y1="366" x2="248" y2="366" stroke="#dbe5f1" stroke-width="1"/>

  <!-- Link weryfikacji -->
  <text x="160" y="388"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="400" font-size="8.5" letter-spacing="1.2"
        text-anchor="middle" fill="#8aa6cd">sportspacepro.eu/verify</text>
</svg>
