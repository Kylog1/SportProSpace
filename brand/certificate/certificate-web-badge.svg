<!-- Web badge do osadzania na stronach klientów — 320x400 px, "as-an-img" gotowy do <img> -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Sport Pro Space — NPS Quality Certificate Edition 2026">
  <defs>
    <linearGradient id="wb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FA"/>
    </linearGradient>
  </defs>
  <rect width="320" height="400" rx="16" fill="url(#wb)" stroke="#dbe5f1"/>
  <!-- top tag -->
  <text x="160" y="34" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="10" letter-spacing="3" text-anchor="middle" fill="#5e80b3">EDITION 2026 · CERTIFIED</text>
  <!-- shield mark -->
  <g transform="translate(96,52) scale(1.0)">
    <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="#1E3A8A"/>
    <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
  </g>
  <!-- text block -->
  <text x="160" y="220" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="11" letter-spacing="2.5" text-anchor="middle" fill="#5e80b3">SPORT PRO SPACE</text>
  <text x="160" y="252" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" letter-spacing="-0.6" text-anchor="middle" fill="#0B1736">Certyfikat</text>
  <text x="160" y="278" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" letter-spacing="-0.6" text-anchor="middle" fill="#0B1736">Jakości</text>
  <!-- divider -->
  <line x1="80" y1="300" x2="240" y2="300" stroke="#dbe5f1"/>
  <!-- stats compact -->
  <g transform="translate(40,320)" font-family="Inter, system-ui, sans-serif">
    <g>
      <text x="40" y="0" font-weight="500" font-size="9" letter-spacing="2" text-anchor="middle" fill="#5e80b3">NPS</text>
      <text x="40" y="26" font-weight="700" font-size="20" letter-spacing="-0.5" text-anchor="middle" fill="#0B1736">+62</text>
    </g>
    <g transform="translate(80,0)">
      <text x="40" y="0" font-weight="500" font-size="9" letter-spacing="2" text-anchor="middle" fill="#5e80b3">RETENCJA</text>
      <text x="40" y="26" font-weight="700" font-size="20" letter-spacing="-0.5" text-anchor="middle" fill="#0B1736">87%</text>
    </g>
    <g transform="translate(160,0)">
      <text x="40" y="0" font-weight="500" font-size="9" letter-spacing="2" text-anchor="middle" fill="#5e80b3">ZAUFANIE</text>
      <text x="40" y="26" font-weight="700" font-size="20" letter-spacing="-0.5" text-anchor="middle" fill="#0B1736">4.5</text>
    </g>
  </g>
  <!-- bottom verify -->
  <text x="160" y="384" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="9" letter-spacing="1.5" text-anchor="middle" fill="#5e80b3">sportprospace.pl/verify</text>
</svg>
