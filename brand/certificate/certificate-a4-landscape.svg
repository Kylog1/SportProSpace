<!-- Certyfikat A4 landscape — 297x210 mm @ 300dpi ≈ 3508x2480 px. SVG skaluje bezstratnie. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3508 2480" width="3508" height="2480">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FA"/>
    </linearGradient>
    <linearGradient id="cBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B1736"/>
    </linearGradient>
    <pattern id="cDots" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#dbe5f1" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="3508" height="2480" fill="url(#cBg)"/>
  <rect width="3508" height="2480" fill="url(#cDots)"/>

  <!-- outer frame -->
  <rect x="120" y="120" width="3268" height="2240" rx="32" fill="none" stroke="#dbe5f1" stroke-width="3"/>
  <rect x="160" y="160" width="3188" height="2160" rx="24" fill="none" stroke="#1E3A8A" stroke-width="2"/>

  <!-- top header bar -->
  <g transform="translate(240,260)">
    <g transform="scale(1.4)">
      <path d="M64 8 L112 24 V60 C112 90 92 112 64 122 C36 112 16 90 16 60 V24 Z" fill="url(#cBadge)"/>
      <path d="M46 50 H72 V62 H56 V72 H82 V92 H46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
      <circle cx="82" cy="50" r="5" fill="#FFFFFF"/>
    </g>
    <text x="220" y="100" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="56" letter-spacing="-1.6" fill="#0B1736">Sport Pro <tspan fill="#1E3A8A">Space</tspan></text>
    <text x="220" y="148" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" letter-spacing="6" fill="#5e80b3">EXPERIENCE INTELLIGENCE</text>
  </g>

  <!-- top right meta -->
  <g transform="translate(2700,280)">
    <text x="600" y="40" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="22" letter-spacing="4" text-anchor="end" fill="#293f66">EDITION 2026</text>
    <text x="600" y="84" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" text-anchor="end" fill="#5e80b3">Certificate ID: SPS-2026-00412</text>
  </g>

  <!-- title block -->
  <g transform="translate(0,720)">
    <text x="1754" y="0" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="36" letter-spacing="12" text-anchor="middle" fill="#1E3A8A">CERTYFIKAT JAKOŚCI DOŚWIADCZENIA</text>
    <text x="1754" y="160" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="160" letter-spacing="-6" text-anchor="middle" fill="#0B1736">NPS Quality Certificate</text>
    <text x="1754" y="240" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="32" letter-spacing="-0.5" text-anchor="middle" fill="#293f66">Niezależny znak jakości badań NPS, retencji i zaufania w sporcie</text>
  </g>

  <!-- "przyznano dla" block -->
  <g transform="translate(0,1180)">
    <text x="1754" y="0" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="24" letter-spacing="8" text-anchor="middle" fill="#5e80b3">NINIEJSZYM POTWIERDZA SIĘ, ŻE</text>
    <!-- recipient name (EDYTOWALNE) -->
    <text id="recipient" x="1754" y="130" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="116" letter-spacing="-3" text-anchor="middle" fill="#1E3A8A">Akademia Sportowa</text>
    <!-- underline -->
    <line x1="954" y1="180" x2="2554" y2="180" stroke="#dbe5f1" stroke-width="2"/>
    <text x="1754" y="240" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="28" text-anchor="middle" fill="#293f66">spełnia kryteria jakości doświadczenia zawodników, rodziców i kibiców</text>
    <text x="1754" y="280" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="28" text-anchor="middle" fill="#293f66">w sezonie <tspan font-weight="600" fill="#0B1736">2026 / 2027</tspan></text>
  </g>

  <!-- 3 KPI tiles -->
  <g transform="translate(720,1640)">
    <g>
      <rect x="0" y="0" width="600" height="220" rx="16" fill="#FFFFFF" stroke="#dbe5f1"/>
      <text x="300" y="56" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" letter-spacing="4" text-anchor="middle" fill="#5e80b3">NPS</text>
      <text x="300" y="160" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="96" letter-spacing="-3" text-anchor="middle" fill="#0B1736">+62</text>
    </g>
    <g transform="translate(720,0)">
      <rect x="0" y="0" width="600" height="220" rx="16" fill="#FFFFFF" stroke="#dbe5f1"/>
      <text x="300" y="56" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" letter-spacing="4" text-anchor="middle" fill="#5e80b3">RETENCJA</text>
      <text x="300" y="160" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="96" letter-spacing="-3" text-anchor="middle" fill="#0B1736">87%</text>
    </g>
    <g transform="translate(1440,0)">
      <rect x="0" y="0" width="600" height="220" rx="16" fill="#FFFFFF" stroke="#dbe5f1"/>
      <text x="300" y="56" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="20" letter-spacing="4" text-anchor="middle" fill="#5e80b3">TRUST</text>
      <text x="300" y="160" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="96" letter-spacing="-3" text-anchor="middle" fill="#0B1736">4.5 / 5</text>
    </g>
  </g>

  <!-- signatures + validity row -->
  <g transform="translate(280,2080)">
    <!-- signature 1 -->
    <g>
      <line x1="0" y1="40" x2="600" y2="40" stroke="#0B1736" stroke-width="2"/>
      <text x="0" y="100" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" fill="#0B1736">Imię Nazwisko</text>
      <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" fill="#5e80b3">Head of Research, Sport Pro Space</text>
    </g>
    <!-- validity -->
    <g transform="translate(1080,0)">
      <text x="400" y="40" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="22" letter-spacing="4" text-anchor="middle" fill="#5e80b3">DATA WYDANIA</text>
      <text x="400" y="100" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="36" letter-spacing="-0.5" text-anchor="middle" fill="#0B1736">13.05.2026</text>
      <text x="400" y="148" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" text-anchor="middle" fill="#5e80b3">Ważny do: 13.05.2027</text>
    </g>
    <!-- signature 2 -->
    <g transform="translate(2348,0)">
      <line x1="0" y1="40" x2="600" y2="40" stroke="#0B1736" stroke-width="2"/>
      <text x="0" y="100" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="28" fill="#0B1736">Imię Nazwisko</text>
      <text x="0" y="140" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="22" fill="#5e80b3">CEO, Sport Pro Space</text>
    </g>
  </g>

  <!-- bottom decorative concentric circles (right) -->
  <g transform="translate(3308,2280)" opacity="0.35">
    <circle r="180" fill="none" stroke="#1E3A8A" stroke-width="2"/>
    <circle r="240" fill="none" stroke="#1E3A8A" stroke-width="1"/>
    <circle r="300" fill="none" stroke="#1E3A8A" stroke-width="1"/>
  </g>

  <!-- verification footer -->
  <text x="1754" y="2300" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="20" letter-spacing="2" text-anchor="middle" fill="#5e80b3">Weryfikacja autentyczności: sportprospace.pl/certyfikat/SPS-2026-00412</text>
</svg>
